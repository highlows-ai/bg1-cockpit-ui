<style>
/* ============================
PORTABLE, NAMESPACED CSS
============================ */

/* Name Block */
.cockpit-name-block {
    background: #2f2f2f;
    color: #fff;
    padding: 10px;
    border: 2px solid #555;
    margin-bottom: 10px;
}

/* Left Column Container */
.cockpit-left-column {
    width: 40%;
    float: left;
    padding-right: 10px;
}

/* Right Column Container */
.cockpit-right-column {
    width: 60%;
    float: right;
}

/* Portrait Block */
.cockpit-portrait-block {
    width: 100%;
    background: #222;
    border: 2px solid #555;
    padding: 10px;
    text-align: center;
    color: #fff;
}

/* Portrait Stats Rectangle (Static BG1-style) */
.cockpit-portrait-stats-rectangle {
    width: 100%;
    background: #1e1e1e;
    border: 2px solid #444;
    padding: 10px 12px;
    margin-top: 12px;
    border-radius: 4px;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
}

.cockpit-portrait-stat-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #333;
}

.cockpit-portrait-stat-row:last-child {
    border-bottom: none;
}

.cockpit-portrait-stat-label {
    font-weight: 600;
    color: #cfcfcf;
}

.cockpit-portrait-stat-value {
    font-weight: 500;
    color: #ffffff;
}

/* Left Column Blocks */
.cockpit-panel-block {
    background: #2b2b2b;
    border: 2px solid #555;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    color: #fff;
}

/* Dynamic Rectangle Under Left Column */
.cockpit-dynamic-rectangle {
    background: #1a1a1a;
    border: 2px solid #666;
    padding: 12px;
    margin-top: 10px;
    min-height: 120px;
    color: #fff;
}

/* Clearfix */
.cockpit-clear {
    clear: both;
}
</style>

<div class="cockpit-left-column">

    <div class="cockpit-panel-block" data-content="Information Content Goes Here">
        Information
    </div>

    <div class="cockpit-panel-block" data-content="Class Content Goes Here">
        Class
    </div>

    <div class="cockpit-panel-block" data-content="Stats Content Goes Here">
        Stats
    </div>

    <div class="cockpit-panel-block" data-content="Biography Content Goes Here">
        Biography
    </div>

    <div class="cockpit-panel-block" data-content="Combat Stats Content Goes Here">
        Combat Stats
    </div>

    <div class="cockpit-panel-block" data-content="Skills Content Goes Here">
        Skills
    </div>

    <div class="cockpit-panel-block" data-content="Abilities Content Goes Here">
        Abilities
    </div>

    <div class="cockpit-panel-block" data-content="References Content Goes Here">
        References
    </div>

    <!-- Dynamic Rectangle -->
    <div class="cockpit-dynamic-rectangle" id="dynamicRectangle">
        Click a block to display its content.
    </div>

</div>

<div class="cockpit-right-column">

    <!-- Portrait -->
    <div class="cockpit-portrait-block">
        <img src="/assets/portraits/sullivan_brian_portrait2.jpg"
             alt="Character Portrait"
             style="width:100%; border:2px solid #777;">
    </div>

    <!-- Static BG1-style Portrait Stats Rectangle -->
    <div class="cockpit-portrait-stats-rectangle">
        <div class="cockpit-portrait-stat-row">
            <span class="cockpit-portrait-stat-label">Sex:</span>
            <span class="cockpit-portrait-stat-value">Male</span>
        </div>
        <div class="cockpit-portrait-stat-row">
            <span class="cockpit-portrait-stat-label">Race:</span>
            <span class="cockpit-portrait-stat-value">Human</span>
        </div>
        <div class="cockpit-portrait-stat-row">
            <span class="cockpit-portrait-stat-label">Class:</span>
            <span class="cockpit-portrait-stat-value">Fighter</span>
        </div>
        <div class="cockpit-portrait-stat-row">
            <span class="cockpit-portrait-stat-label">Alignment:</span>
            <span class="cockpit-portrait-stat-value">Lawful Good</span>
        </div>
    </div>

</div>

<div class="cockpit-clear"></div>

<script>
/* ============================
DYNAMIC RECTANGLE LOGIC
============================ */

document.querySelectorAll('.cockpit-panel-block').forEach(block => {
    block.addEventListener('click', () => {
        const content = block.getAttribute('data-content');
        document.getElementById('dynamicRectangle').innerText = content;
    });
});
</script>
