<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BG1 Cockpit UI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAME BLOCK -->
    <div class="cockpit-name-block">
        <h2>Gorion's Ward</h2>
    </div>

    <!-- MAIN RIBBON -->
    <div class="cockpit-ribbon">
        <div class="cockpit-ribbon-item" data-content="Sex: Male\nRace: Human\nClass: Fighter\nAlignment: Lawful Good">Information</div>
        <div class="cockpit-ribbon-item" data-content="Class Stats Coming Soon">Class Stats</div>
        <div class="cockpit-ribbon-item" data-content="Biography Coming Soon">Biography</div>
        <div class="cockpit-ribbon-item" data-content="Combat Stats Coming Soon">Combat Stats</div>
        <div class="cockpit-ribbon-item" data-content="Skills Coming Soon">Skills</div>
        <div class="cockpit-ribbon-item" data-content="Abilities Coming Soon">Abilities</div>
        <div class="cockpit-ribbon-item" data-content="References Coming Soon">References</div>
    </div>

    <!-- SUB-RIBBON -->
    <div class="cockpit-sub-ribbon">
        <div class="cockpit-sub-ribbon-item" data-subcontent="Block One Content">Block One</div>
        <div class="cockpit-sub-ribbon-item" data-subcontent="Block Two Content">Block Two</div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="cockpit-container">

        <!-- LEFT COLUMN -->
        <div class="cockpit-left-column">
            <div id="dynamicRectangle" class="cockpit-dynamic-rectangle">
                Select a panel to view details.
            </div>
        </div>

        <!-- CENTER COLUMN -->
        <div class="cockpit-center-column">
            <div class="cockpit-portrait-stats-rectangle">
                <div class="cockpit-portrait-stat-row">
                    <span class="cockpit-portrait-stat-label">HP</span>
                    <span class="cockpit-portrait-stat-value">12</span>
                </div>
                <div class="cockpit-portrait-stat-row">
                    <span class="cockpit-portrait-stat-label">AC</span>
                    <span class="cockpit-portrait-stat-value">6</span>
                </div>
                <div class="cockpit-portrait-stat-row">
                    <span class="cockpit-portrait-stat-label">THAC0</span>
                    <span class="cockpit-portrait-stat-value">20</span>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="cockpit-right-column">

            <!-- SINGLE PORTRAIT -->
            <div class="cockpit-portrait-block">
                <img src="assets/portraits/portrait.jpg" class="cockpit-portrait-img">
            </div>

            <!-- BASIC INFORMATION CARD -->
            <div class="cockpit-info-card">
                <div class="cockpit-info-row">
                    <span class="cockpit-info-label">Name:</span>
                    <span class="cockpit-info-value">Gorion's Ward</span>
                </div>
                <div class="cockpit-info-row">
                    <span class="cockpit-info-label">Race:</span>
                    <span class="cockpit-info-value">Human</span>
                </div>
                <div class="cockpit-info-row">
                    <span class="cockpit-info-label">Class:</span>
                    <span class="cockpit-info-value">Fighter</span>
                </div>
                <div class="cockpit-info-row">
                    <span class="cockpit-info-label">Alignment:</span>
                    <span class="cockpit-info-value">Lawful Good</span>
                </div>
            </div>

        </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
